<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock, Paper, Scissors TOP Game</title>
    <script src="game.js"></script>
    
    <style>
        body {
            background-color: purple;
            margin: 0;
            padding: 10px;
            font-family: sans-serif;
        }
        
        .header {
            display: flex;
            background-color: salmon;
            color: aliceblue;
            border: 3px dotted black;
            justify-content: center;
            text-align: center;
            margin-bottom: 20px;
        }

        .image {
            display: flex;
            justify-content: center;
            margin-bottom: 20px;
        }

        .image img {
            max-width: 100%;
            height: auto;
            display: block;
        }

        .paragraph {
            display: flex;
            background-color: salmon;
            color: black;
            border: 3px dotted black;
            justify-content: center;
            text-align: center;
            font-size: larger;
            padding: 10px;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>ROCK, PAPER, SCISSORS GAME!!!</h1>
    </div>

    <div class="image">
        <img src="https://cdn.pixabay.com/photo/2013/07/12/15/02/fingers-149295_1280.png" alt="rock, paper, scissors">
    </div>

    <div class="paragraph">
         <p>Open the console / "inspect" and refresh the site to start. (≧▽≦)</p>
    </div>
</body>
</html>
