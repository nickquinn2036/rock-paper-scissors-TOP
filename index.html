<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock, Paper, Scissors TOP Game</title>
    <script src="game.js" defer></script>
    
    <style>
        body {
            background-color: purple;
            margin: 0;
            padding: 10px;
            font-family: sans-serif;
        }
        
        .header {
            display: flex;
            background-color: salmon;
            color: aliceblue;
            border: 3px dotted black;
            justify-content: center;
            text-align: center;
            margin-bottom: 20px;
        }

        .image {
            display: flex;
            justify-content: center;
            margin-bottom: 20px;
        }

        .image img {
            max-width: 100%;
            height: auto;
            display: block;
        }

        .paragraph {
            display: flex;
            background-color: salmon;
            color: black;
            border: 3px dotted black;
            justify-content: center;
            text-align: center;
            font-size: larger;
            padding: 10px;
        }
        .controls button {
        padding: 12px 24px;
        font-size: 1.1rem;
        font-weight: bold;
        cursor: pointer;
        border-radius: 8px;
        border: 2px solid black;
        background-color: salmon;
        color: white;
}

        .controls {
        display: flex;
        justify-content: center;
        gap: 15px;
        margin-top: 16px;
        margin-bottom: 16px;
}

        #results {
        margin-top: 30px;
        font-size: 1.3rem;
        color: white;
        text-align: center;
}

        .image img {
        max-width: 350px;
        width: 100%;
        height: auto;
        display: block;
}

    </style>
</head>
<body>
    <div class="header">
        <h1>ROCK, PAPER, SCISSORS GAME!!! (RNG)</h1>
    </div>

    <div class="image">
        <img src="https://cdn.pixabay.com/photo/2013/07/12/15/02/fingers-149295_1280.png" alt="rock, paper, scissors">
    </div>

    <div class="paragraph">
         <p>Click a button below to choose thy weaponry! (≧▽≦)</p>
    </div>

    <div class="controls">
        <button id="rock">Rock</button>
        <button id="paper">Paper</button>
        <button id="scissors">Scissors</button>
    </div>

    <div id="results"></div>

</body>
</html>
